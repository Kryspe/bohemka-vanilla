name: Sync boh.cz content

on:
  schedule:
    - cron: "0 5 * * 1"   # kazde pondeli 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run sync
        run: python3 scripts/sync_boh.py
      - name: Rebuild demo data
        run: |
          pip install pillow
          python3 scripts/build_demo_data.py
      - name: Commit and push changes
        run: |
          git config user.name "boh-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore(content): sync boh.cz"
          git push
